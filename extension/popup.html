<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Agent Browser Bridge</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>Agent Browser Bridge</h1><p id="status" role="status">Checking connection…</p>
<p>While connected, local agents with your token can read and control your signed-in tabs.</p>
<label for="token">Bridge token</label><input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Paste token from npm start">
<div><button id="connect">Connect</button><button id="disconnect">Disconnect</button></div>
<p class="detail">Local bridge: 127.0.0.1:19333. Chrome displays a debugging banner when a tab is controlled. Disconnect stops access and detaches controlled tabs.</p>
<script src="popup.js" type="module"></script></body></html>
